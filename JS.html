<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d3a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #0a0a12;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #c9d1d9;
            border: 1px solid #333;
        }

        h1 {
            color: #ff79c6;
            margin-bottom: 10px;
            font-size: 28px;
        }

        h2 {
            color: #8be9fd;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: normal;
        }

        .info {
            background: #1a1a22;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #50fa7b;
        }

        button {
            background: #50fa7b;
            color: #1e1e2e;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        button:hover {
            background: #69ff94;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(80,250,123,0.3);
        }

        .output {
            background: #050508;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #2a2a35;
        }

        .output div {
            margin: 3px 0;
            padding: 4px;
            border-left: 3px solid #50fa7b;
            padding-left: 10px;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a22;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #50fa7b;
            border-radius: 10px;
        }

        .caesar-panel {
        background: #0a0a0a;
        border: 1px solid #1a3a1a;
        padding: 15px;
        margin: 15px 0;
        border-radius: 3px;
        }

        .caesar-panel label {
            color: #33ff33;
            display: block;
            margin: 10px 0 5px 0;
            font-size: 13px;
        }

        .caesar-panel input {
            background: #000000;
            border: 1px solid #33ff33;
            color: #33ff33;
            padding: 8px;
            font-family: monospace;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        .caesar-panel input:focus {
            outline: none;
            border-color: #66ff66;
            box-shadow: 0 0 5px #33ff33;
        }

        .caesar-panel .button-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Основи JavaScript: синтаксис та базові алгоритми</h1>
        <div class="info">
            <strong>Завдання</strong><br>
        </div>
        
        <div class="controls">
            <button onclick="runAllTasks()">▶ Запустити всі завдання</button>
            <button onclick="runTask3()">📖 Завдання 3</button>
            <button onclick="runTask6()">🔐 Завдання 6</button>
            <button onclick="runTask12()">🔓 Завдання 12</button>
            <button onclick="clearOutput()">🗑 Очистити</button>
        </div>
        
        <div class="caesar-panel">
            <div style="color: #33ff33; margin-bottom: 10px; font-weight: bold;">[ ШИФР ЦЕЗАРЯ - IНТЕРАКТИВНИЙ РЕЖИМ ]</div>
    
            <label>ВВЕДIТЬ ТЕКСТ ДЛЯ ШИФРУВАННЯ:</label>
            <input type="text" id="inputText" placeholder="Наприклад: Hello, World!" value="Hello, World!">
    
            <label>ВВЕДIТЬ ЗСУВ (ЦIЛЕ ЧИСЛО ВIД 1 ДО 25):</label>
            <input type="number" id="shiftValue" placeholder="3" value="3" min="1" max="25">
    
            <div class="button-group">
                <button onclick="encryptText()">ЗАШИФРУВАТИ</button>
                <button onclick="runTestExamples()">ТЕСТОВI ПРИКЛАДИ</button>
            </div>
        </div>

        <div class="output" id="output">
            👆 Натисніть кнопку, щоб побачити результат...
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
